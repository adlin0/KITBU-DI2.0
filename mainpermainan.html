
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Permainan - Kit Budi</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fc;
            color: #263f78;
        }

        .top-bar {
            min-height: 65px;
            background: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .logo { width: 65px; }

        .home-btn, .back-btn, .open-btn {
            border: none;
            border-radius: 25px;
            padding: 11px 18px;
            color: white;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .home-btn { background: #ed9c2f; }
        .back-btn { background: #777; }
        .open-btn { background: #4260b0; }

        .PERMAINAN-heading {
            text-align: center;
            padding: 18px 10px;
        }

        .PERMAINAN-heading h1 {
            margin: 0 0 7px;
            font-size: 23px;
        }

        .PERMAINAN-heading p {
            margin: 0;
            font-size: 13px;
            color: #666;
        }

        .PERMAINAN-frame-container {
            width: 100%;
            height: calc(100vh - 205px);
            min-height: 450px;
            background: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: white;
        }

        .bottom-bar {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .notice {
            text-align: center;
            font-size: 12px;
            color: #666;
            padding: 8px 12px;
        }

        @media (max-width: 600px) {
            .top-bar { flex-wrap: wrap; }
            .PERMAINAN-heading h1 { font-size: 19px; }
            .PERMAINAN-frame-container { height: 70vh; min-height: 400px; }
        }
    </style>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="top-bar">
        <img src="assets/images/logo-kit-budi.jpg"
             class="logo" alt="Logo Kit Budi">

        <button class="home-btn"
                onclick="window.location.href='index.html'">
            🏠 HALAMAN UTAMA
        </button>
    </div>

    <div class="PERMAINAN-heading">
        <h1>🎮 <span id="PERMAINANTitle">MAIN PERMAINAN</span></h1>
        <p>Selamat bermain dan selamat belajar!</p>
    </div>

    <div class="PERMAINAN-frame-container">
        <iframe id="PERMAINANFrame"
                title="Permainan Kit Budi"
                allow="fullscreen; autoplay; gamepad">
        </iframe>
    </div>

    <div class="notice" id="frameNotice">
        Jika permainan tidak dipaparkan, tekan butang BUKA PERMAINAN DI HALAMAN INI.
    </div>

    <div class="bottom-bar">
        <button class="back-btn"
                onclick="window.location.href='pilihpermainan.html'">
            ↩ KEMBALI KE PILIHAN PERMAINAN
        </button>

        <button class="open-btn" id="openPERMAINANButton">
            BUKA PERMAINAN DI HALAMAN INI
        </button>
    </div>

    <script>
        const PERMAINANTitle =
            sessionStorage.getItem("selectedPERMAINANTitle");

        const PERMAINANUrl =
            sessionStorage.getItem("selectedPERMAINANUrl");

        const titleElement =
            document.getElementById("PERMAINANTitle");

        const PERMAINANFrame =
            document.getElementById("PERMAINANFrame");

        const openPERMAINANButton =
            document.getElementById("openPERMAINANButton");

        if (!PERMAINANUrl) {
            titleElement.textContent = "PERMAINAN TIDAK DIJUMPAI";

            document.getElementById("frameNotice").textContent =
                "Sila kembali ke pilihan PERMAINAN dan pilih permainan.";

            openPERMAINANButton.style.display = "none";

        } else {
            titleElement.textContent = PERMAINANTitle || "MAIN PERMAINAN";

            PERMAINANFrame.src = PERMAINANUrl;

            openPERMAINANButton.addEventListener("click", function () {
                // Buka PERMAINAN dalam tab yang sama jika iframe disekat.
                window.location.href = PERMAINANUrl;
            });
        }
    </script>

</body>
</html>
