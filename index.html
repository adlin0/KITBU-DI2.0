
<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIT BUDI - Pengembaraan Cerita Rakyat</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         HALAMAN UTAMA
    ========================== -->

    <main class="home-page">

        <!-- LOGO KIT BUDI -->
        <div class="logo-container">
            <img
                src="assets/images/logo-kit-budi.jpg"
                alt="Logo KIT BUDI"
                class="logo"
            >
        </div>

        <!-- BUTANG MUZIK -->
        <button
            id="musicButton"
            class="music-button"
            type="button">
            🔇 MUZIK OFF
        </button>

        <!-- MUZIK KIT BUDI -->
        <audio
            id="backgroundMusic"
            src="assets/audio/lagu-kit-budi.mp3"
            loop>
        </audio>

        <!-- GAMBAR MUKA DEPAN ASAL -->
        <div class="home-content">

            <img
                src="https://lh3.googleusercontent.com/d/1Yi9jnO2YcAM9acSlGIiHrWTnmgs2Plg1"
                alt="Pengembaraan Budi Menelusuri Cerita Rakyat"
                class="adventure-image"
            >

            <!-- BUTANG MULA PENGEMBARAAN -->
            <button
                id="startButton"
                class="start-button"
                type="button">

                🚀 MULA PENGEMBARAAN

            </button>

        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
