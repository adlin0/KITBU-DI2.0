
<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pilih Buku Cerita - Kit Budi</title>

    <script src="js/data.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 20px 50px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #263f78;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 85px;
            height: auto;
        }

        button, a {
            cursor: pointer;
            text-decoration: none;
        }

        .home-btn,
        .music-btn {
            border: none;
            border-radius: 25px;
            padding: 11px 18px;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .home-btn {
            background: #ed9c2f;
        }

        .music-btn {
            background: #4260b0;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .heading p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        .book-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .book-card {
            width: 220px;
            padding: 15px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.10);
            text-align: center;
            transition: transform 0.2s ease;
        }

        .book-card:hover {
            transform: translateY(-5px);
        }

        /* GAMBAR MUKA DEPAN BUKU */

        .book-cover {
            width: 100%;
            height: 230px;
            border-radius: 12px;
            overflow: hidden;
            background: #eeeeee;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .book-card h3 {
            min-height: 42px;
            font-size: 16px;
            line-height: 1.3;
            margin: 15px 0 8px;
        }

        .book-number {
            color: #777;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .select-btn {
            border: none;
            border-radius: 25px;
            background: #4260b0;
            color: white;
            padding: 11px 22px;
            font-size: 12px;
            font-weight: bold;
        }

        .select-btn:hover {
            background: #263f78;
        }

        .back-container {
            text-align: center;
            margin-top: 35px;
        }

        .back-btn {
            display: inline-block;
            background: #777;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: bold;
        }

        .image-error {
            height: 230px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d93025;
            font-size: 13px;
            background: #eeeeee;
            border-radius: 12px;
            padding: 10px;
        }

        @media (max-width: 600px) {

            .book-card {
                width: min(100%, 280px);
            }

            .heading h1 {
                font-size: 23px;
            }

            .top-bar {
                flex-wrap: wrap;
                gap: 10px;
            }

        }

    </style>
    <link rel="stylesheet" href="css/style.css">

</head>


<body class="book-selection-page">

    <!-- TOP BAR -->

    <div class="top-bar">

        <img
            src="assets/images/logo-kit-budi.jpg"
            class="logo"
            alt="Logo Kit Budi"
        >

        <div>

            <button class="music-btn" id="musicButton">
                🔇 MUZIK OFF
            </button>

            <button
                class="home-btn"
                onclick="window.location.href='index.html'"
            >
                🏠 HALAMAN UTAMA
            </button>

        </div>

    </div>


    <!-- TAJUK -->

    <div class="heading">

        <h1>📚 PILIH BUKU CERITA</h1>

        <p id="levelDescription">
            Pilih sebuah buku cerita.
        </p>

    </div>


    <!-- SENARAI BUKU -->

    <div
        class="book-container"
        id="bookContainer"
    ></div>


    <!-- BUTANG KEMBALI -->

    <div class="back-container">

        <a
            href="rakbuku.html"
            class="back-btn"
        >
            ↩ KEMBALI KE RAK BUKU
        </a>

    </div>


    <!-- MUZIK -->

    <audio
        id="backgroundMusic"
        src="assets/audio/lagu-kit-budi.mp3"
        loop
    ></audio>


    <!-- JAVASCRIPT -->

    <script>

        // ======================================
        // PILIH TAHAP
        // ======================================

        const selectedLevel =
            sessionStorage.getItem("selectedLevel");


        const bookContainer =
            document.getElementById("bookContainer");


        const levelDescription =
            document.getElementById("levelDescription");


        // ======================================
        // MUZIK
        // ======================================

        const music =
            document.getElementById("backgroundMusic");


        const musicButton =
            document.getElementById("musicButton");


        let musicPlaying = false;


        music.loop = true;


        musicButton.addEventListener("click", async function () {

            if (!musicPlaying) {

                try {

                    await music.play();

                    musicPlaying = true;

                    musicButton.textContent = "🔊 MUZIK ON";

                } catch (error) {

                    alert("Muzik tidak dapat dimainkan.");

                }

            } else {

                music.pause();

                musicPlaying = false;

                musicButton.textContent = "🔇 MUZIK OFF";

            }

        });


        // ======================================
        // PAPARKAN BUKU
        // ======================================

        if (!selectedLevel || !learningData[selectedLevel]) {

            bookContainer.innerHTML =
                "<p>Sila pilih tahap pembelajaran dahulu.</p>";

        } else {

            const books = learningData[selectedLevel];


            if (selectedLevel === "rendah") {

                levelDescription.textContent =
                    "TAHAP RENDAH - Pilih satu daripada 2 buku cerita.";

            } else {

                levelDescription.textContent =
                    "TAHAP SEDERHANA - Pilih satu daripada 5 buku cerita.";

            }


            books.forEach(function (book, index) {

                const card = document.createElement("div");

                card.className = "book-card";


                // GAMBAR MUKA DEPAN

                const cover = document.createElement("div");

                cover.className = "book-cover";


                const coverImage = document.createElement("img");

                coverImage.src = book.image;

                coverImage.alt = "Muka depan " + book.title;


                coverImage.onerror = function () {

                    cover.innerHTML =
                        '<div class="image-error">' +
                        'Gambar tidak dijumpai: ' +
                        book.image +
                        '</div>';

                    console.error(
                        "Gambar tidak dijumpai:",
                        book.image
                    );

                };


                cover.appendChild(coverImage);


                // TAJUK BUKU

                const title = document.createElement("h3");

                title.textContent = book.title;


                // NOMBOR BUKU

                const number = document.createElement("div");

                number.className = "book-number";

                number.textContent = "Buku " + (index + 1);


                // BUTANG PILIH BUKU

                const button = document.createElement("button");

                button.className = "select-btn";

                button.textContent = "PILIH BUKU";


                button.addEventListener("click", function () {

                    if (!book.book) {

                        alert(
                            "Pautan buku tidak dijumpai dalam data.js."
                        );

                        return;

                    }


                    sessionStorage.setItem(
                        "selectedBookId",
                        book.id
                    );


                    sessionStorage.setItem(
                        "selectedBookUrl",
                        book.book
                    );


                    sessionStorage.setItem(
                        "selectedBookTitle",
                        book.title
                    );


                    window.location.href = "baca.html";

                });


                // MASUKKAN SEMUA DALAM KAD

                card.appendChild(cover);

                card.appendChild(title);

                card.appendChild(number);

                card.appendChild(button);


                bookContainer.appendChild(card);

            });

        }

    </script>

</body>

</html>
